name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://jie_test:jie_test_local_password@localhost:5432/jie_test?schema=public
      TEST_DATABASE_URL: postgresql://jie_test:jie_test_local_password@localhost:5432/jie_test?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jie_test
          POSTGRES_PASSWORD: jie_test_local_password
          POSTGRES_DB: jie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jie_test -d jie_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        run: npm install --global npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Verify repository and database
        run: npm run verify:full
