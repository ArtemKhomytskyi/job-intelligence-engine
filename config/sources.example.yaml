# Documentation templates only. These sources are disabled and cannot collect jobs.
# Copy this file to the Git-ignored config/sources.yaml, replace every placeholder,
# then enable only the real sources you intend JIE to contact.
sources:
  - id: my-greenhouse-source
    type: greenhouse
    enabled: false
    displayName: Replace with company name
    company: Replace with company name
    tags: []
    trackIds:
      - data-science
    trackPolicy: preferred
    settings:
      boardToken: replace-with-real-board-token
      boardUrl: https://boards.greenhouse.io/replace-with-real-board-token

  - id: my-lever-source
    type: lever
    enabled: false
    displayName: Replace with company name
    company: Replace with company name
    tags: []
    trackIds:
      - data-science
    trackPolicy: preferred
    settings:
      companySlug: replace-with-real-company-slug
      jobsUrl: https://jobs.lever.co/replace-with-real-company-slug

  - id: my-generic-job-list
    type: generic-job-list
    enabled: false
    displayName: Replace with careers page name
    company: Replace with company name
    tags: []
    trackIds:
      - data-science
    trackPolicy: preferred
    settings:
      url: https://replace-with-real-careers-url.example/jobs
      allowBrowserFallback: false

  - id: my-generic-page
    type: generic-page
    enabled: false
    displayName: Replace with job page name
    company: Replace with company name
    tags: []
    trackIds:
      - data-science
    trackPolicy: preferred
    settings:
      url: https://replace-with-real-job-url.example/job
      allowBrowserFallback: false

companies:
  - id: my-company
    name: Replace with company name
    enabled: false
    careersUrl: https://careers.example.com/jobs
    tags: []
    trackIds:
      - data-science
    trackPolicy: preferred
