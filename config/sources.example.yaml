# Source definitions are validated locally; validation performs no network requests.
sources:
  - id: example-greenhouse
    type: greenhouse
    enabled: true
    displayName: Example Greenhouse Board
    company: Example Company
    requestTimeoutMs: 15000
    requestsPerSecond: 2
    tags:
      - ats
    trackIds:
      - data-science
      - ai
    settings:
      boardToken: example-company
      boardUrl: https://boards.example.com/example-company
  - id: example-lever
    type: lever
    enabled: true
    displayName: Example Lever Site
    company: Example Labs
    requestTimeoutMs: 15000
    requestsPerSecond: 2
    tags:
      - ats
    trackIds:
      - quant
      - marketing-devrel
    settings:
      companySlug: example-labs
      jobsUrl: https://jobs.example.com/example-labs
  - id: example-job-list
    type: generic-job-list
    enabled: true
    displayName: Example Generic Jobs List
    company: Example Web Company
    requestTimeoutMs: 15000
    requestsPerSecond: 1
    tags:
      - structured-data
    trackIds:
      - community-web3
    settings:
      url: https://careers.example.com/jobs
      browserTimeoutMs: 30000
      maxDiscoveredLinks: 50
      maxTraversalDepth: 1
      allowBrowserFallback: true
  - id: example-page-disabled
    type: generic-page
    enabled: false
    displayName: Disabled Generic Page Example
    tags:
      - manual-review
    trackIds: []
    settings:
      url: https://careers.example.org/openings
      allowBrowserFallback: false
